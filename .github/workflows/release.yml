name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v0.1.0); created on the current commit if it does not exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X pathrelay/internal/version.Version=${VERSION}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            echo "Building pathrelay $os/$arch..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "dist/pathrelay-$os-$arch/pathrelay" .
            tar -czf "dist/pathrelay-$os-$arch.tar.gz" -C "dist/pathrelay-$os-$arch" pathrelay
          done
          cd dist
          sha256sum pathrelay-*.tar.gz > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "pathrelay $VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
